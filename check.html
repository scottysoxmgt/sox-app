<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05080F">
<title>Has this customer paid?</title>
<link rel="icon" href="/sox-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#05080F;--card:#0D1628;--fg:#EAF1FF;--mut:#90A4C8;--line:#1C2C4A;--blue:#35B4FF;--blue-ink:#02101F;--ok:#3DDC97;--ok-bg:rgba(61,220,151,.13);--warn:#FF6B78;--amber:#FFB454;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--fg);font:17px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:url(/rb-tr.svg) 100% 0/150% auto no-repeat fixed,url(/rb-bl.svg) 0 100%/150% auto no-repeat fixed,radial-gradient(700px 360px at 85% -80px,rgba(42,107,255,.28),transparent 70%),radial-gradient(500px 300px at -10% 20%,rgba(53,180,255,.10),transparent 70%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;margin:0 calc(-1*max(16px,env(safe-area-inset-left))) 0 calc(-1*max(16px,env(safe-area-inset-right)));padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:rgba(5,8,15,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,#2A6BFF,#7BE9FF,#2A6BFF,transparent) 1;box-shadow:0 6px 24px -10px rgba(53,180,255,.5)}
.top .in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top img{width:30px;height:30px;border-radius:9px;box-shadow:0 0 14px rgba(53,180,255,.45)}
.top b{font-family:Sora,Inter,system-ui,sans-serif;letter-spacing:-.01em}
main{max-width:460px;margin:28px auto 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 0 0 1px rgba(53,180,255,.04),0 8px 28px rgba(0,0,0,.35)}
h1{font-family:Sora,Inter,system-ui,sans-serif;font-size:24px;letter-spacing:-.01em;line-height:1.25;margin:6px 0 10px}
small,.mut{color:var(--mut)}
.biz{display:inline-block;font:600 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7BE9FF;background:rgba(53,180,255,.1);border:1px solid rgba(53,180,255,.3);padding:6px 10px;border-radius:99px}
.amt{font:600 40px/1.1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;margin:10px 0 4px;text-shadow:0 0 22px rgba(53,180,255,.35)}
.meta{color:var(--mut);font-size:15px}
.btns{margin-top:20px}
button{display:block;width:100%;font:inherit;font-weight:700;padding:16px;border-radius:12px;border:2px solid var(--blue);cursor:pointer;margin-top:12px;min-height:52px;transition:box-shadow .2s,opacity .2s}
.yes{background:var(--blue);color:var(--blue-ink);box-shadow:0 0 22px rgba(53,180,255,.22)}
.yes:hover{box-shadow:0 0 28px rgba(53,180,255,.4)}
.no{background:transparent;color:var(--blue)}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:16px;font-weight:600;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px}
.msg.ok{color:var(--ok);background:var(--ok-bg)}.msg.err{color:var(--amber);background:rgba(255,180,84,.13)}
.msg svg{flex:none;width:22px;height:22px;margin-top:1px}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:22px 0 0}
</style></head><body>
<div class="top"><div class="in"><img src="/sox-icon.svg" alt=""><b>SOX Management</b></div></div>
<main><div class="card" id="c"><small>Loading…</small></div><p class="foot">Sent to you by your SOX Management app.</p></main>
<script>
var API = "https://rqqnwvletctvjsosfhgw.supabase.co/functions/v1/safety-reply";
// The code is the last part of /c/<code> (short links), or ?t= (older long links)
var pm = location.pathname.match(/\/c\/([0-9a-fA-F]{10})\/?$/);
var t = pm ? pm[1] : new URLSearchParams(location.search).get("t"), c = document.getElementById("c");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function money(n){return "$"+Number(n||0).toLocaleString("en-AU",{maximumFractionDigits:2})}
var TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
var WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v5.5M12 16.5v.1"/></svg>';
function done(text,cls){c.innerHTML='<h1>Thanks, all done.</h1><div class="msg '+cls+'">'+(cls==="ok"?TICK:WARN)+'<span>'+esc(text)+'</span></div>'}
function send(a){
  var bs=c.querySelectorAll("button");bs.forEach(function(b){b.disabled=true});
  fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t:t,a:a})})
   .then(function(r){return r.json()}).then(function(j){
     if(j.error) return done("Something went wrong. Please try the link again.","err");
     var s=j.already||j.status;
     done(s==="paid"?"Marked as paid. We won't chase them.":"Got it. The reminder will go out as planned.","ok");
   }).catch(function(){done("Couldn't connect. Please try again.","err")});
}
if(!t){c.innerHTML='<h1>This link isn\'t right.</h1><small>Open the link from your text message.</small>'}
else fetch(API+"?t="+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(j){
  if(j.error) return c.innerHTML='<h1>Link not found.</h1><small>It may be old. Check your latest text.</small>';
  if(j.status!=="pending") return done(j.status==="paid"?"Already marked as paid.":"Already answered. The reminder is going ahead.","ok");
  c.innerHTML='<span class="biz">'+esc(j.business)+'</span><h1>Has '+esc(j.customer||"this customer")+' paid?</h1>'
   +'<div class="amt">'+money(j.amount)+'</div><div class="meta">Invoice '+esc(j.number||"")+(j.due?' · due '+esc(j.due):'')+'</div>'
   +'<div class="btns"><button class="yes" id="y">Yes, they\'ve paid</button><button class="no" id="n">No, send the reminder</button></div>';
  document.getElementById("y").onclick=function(){send("paid")};document.getElementById("n").onclick=function(){send("go_ahead")};
}).catch(function(){c.innerHTML='<h1>Couldn\'t load.</h1><small>Check your internet and try again.</small>'});
</script></body></html>
